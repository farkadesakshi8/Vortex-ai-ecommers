<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VORTEX.AI Enterprise Matrix{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Unique High-End Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-obsidian: #020617;
            --neon-cyan: #06b6d4;
            --neon-indigo: #6366f1;
            --neon-violet: #8b5cf6;
            --neon-rose: #f43f5e;
            --neon-emerald: #10b981;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-obsidian);
            background-image: 
                radial-gradient(at 10% 10%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(139, 92, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(99, 102, 241, 0.08) 0px, transparent 60%);
            background-attachment: fixed;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .syne { font-family: 'Syne', sans-serif; }

        /* Multi-Layer Glassmorphism Container */
        .vortex-glass {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(6, 182, 212, 0.22);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .vortex-glass:hover {
            border-color: rgba(6, 182, 212, 0.65);
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.25);
            transform: translateY(-2px);
        }

        /* Neon Glow Accents */
        .glow-cyan { text-shadow: 0 0 12px rgba(6, 182, 212, 0.6); }
        .glow-violet { text-shadow: 0 0 12px rgba(139, 92, 246, 0.6); }

        /* Custom Scrollbar Styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(2, 6, 23, 0.8); }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; border: 1px solid rgba(6, 182, 212, 0.2); }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-cyan-400 selection:text-slate-950">

    <!-- Top Cyberpunk Telemetry Navbar -->
    <nav class="border-b border-cyan-500/20 bg-slate-950/90 backdrop-blur-3xl sticky top-0 z-50 px-8 py-4 flex justify-between items-center shadow-2xl">
        
        <!-- Logo & Telemetry Status -->
        <div class="flex items-center space-x-4">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-cyan-400 via-indigo-600 to-violet-600 flex items-center justify-center text-slate-950 shadow-lg shadow-cyan-500/30 font-black text-xl">
                <i class="fa-solid fa-atom animate-spin" style="animation-duration: 12s;"></i>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <span class="syne text-2xl font-black tracking-wider bg-gradient-to-r from-cyan-400 via-indigo-300 to-violet-400 bg-clip-text text-transparent">
                        VORTEX<span class="text-cyan-400">.AI</span>
                    </span>
                    <span class="px-2 py-0.5 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 text-[9px] font-black rounded-full uppercase tracking-widest">
                        v2.4 Pro
                    </span>
                </div>
                <span class="text-[9px] uppercase tracking-widest text-cyan-400/80 font-extrabold block">
                    <i class="fa-solid fa-signal text-[8px] text-emerald-400 mr-1 animate-pulse"></i> Neural Enterprise Matrix
                </span>
            </div>
        </div>

        <!-- Central Navigation Bar -->
        <div class="hidden md:flex items-center space-x-1 bg-slate-900/90 p-1.5 rounded-2xl border border-cyan-500/20 text-xs font-bold shadow-inner">
            <a href="/" class="px-5 py-2.5 rounded-xl transition-all duration-300 hover:bg-gradient-to-r hover:from-cyan-500 hover:to-indigo-600 hover:text-slate-950 text-slate-300 flex items-center gap-2">
                <i class="fa-solid fa-chart-pie"></i> Matrix Core
            </a>
            <a href="/analytics" class="px-5 py-2.5 rounded-xl transition-all duration-300 hover:bg-gradient-to-r hover:from-cyan-500 hover:to-indigo-600 hover:text-slate-950 text-slate-300 flex items-center gap-2">
                <i class="fa-solid fa-chart-line"></i> Deep Telemetry
            </a>
            <a href="/predict" class="px-5 py-2.5 rounded-xl transition-all duration-300 hover:bg-gradient-to-r hover:from-cyan-500 hover:to-indigo-600 hover:text-slate-950 text-slate-300 flex items-center gap-2">
                <i class="fa-solid fa-brain"></i> Neural AI Engine
            </a>
            <a href="/customers" class="px-5 py-2.5 rounded-xl transition-all duration-300 hover:bg-gradient-to-r hover:from-cyan-500 hover:to-indigo-600 hover:text-slate-950 text-slate-300 flex items-center gap-2">
                <i class="fa-solid fa-users-viewfinder"></i> Data Nexus
            </a>
        </div>

        <!-- Export CSV & User Telemetry -->
        <div class="flex items-center space-x-4">
            <a href="/export-csv" class="px-5 py-2.5 bg-gradient-to-r from-cyan-400 to-indigo-600 hover:from-cyan-300 hover:to-indigo-500 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition shadow-lg shadow-cyan-500/25 flex items-center gap-2">
                <i class="fa-solid fa-file-arrow-down"></i> Export CSV
            </a>
            <div class="w-10 h-10 rounded-2xl bg-slate-900 border border-cyan-500/30 flex items-center justify-center font-extrabold text-cyan-400 text-xs shadow-md">
                SK
            </div>
        </div>
    </nav>

    <!-- Main Dynamic Application Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer Telemetry Strip -->
    <footer class="border-t border-cyan-500/20 bg-slate-950 py-6 text-center text-xs text-cyan-400/60 font-semibold tracking-wide">
        <p>VORTEX.AI Enterprise Suite • Powered by Random Forest Machine Learning & Flask • Case Study 2</p>
    </footer>

</body>
</html>
